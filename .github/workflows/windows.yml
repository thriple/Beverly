# Windows build of the editor: a zip with Beverly.exe - unzip and double-click, nothing to install.
# Runs by hand from the Actions tab, or on a push whose commit message contains [release] (releases are for
# finished features, not work in progress). Each build is published as a GitHub Release
# ("Beverly build N", tag build-N, the newest marked Latest) with the zip attached, and also kept under the
# run's "Artifacts". tools/make-zip.ps1 makes the same zip on your own PC.
name: Windows build
on:
  workflow_dispatch:
  push:
    paths: ['editor/**', '.github/workflows/windows.yml']
permissions:
  contents: write   # to publish the release
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor
      - name: Build
        working-directory: editor
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Beverly | Out-Null
          Copy-Item editor/target/release/beverly.exe dist/Beverly/Beverly.exe
          Copy-Item editor/README-windows.txt dist/Beverly/README.txt
          Compress-Archive -Path dist/Beverly -DestinationPath Beverly-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Beverly-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Beverly build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: "Unzip and run Beverly.exe. Controls: README.txt."
          files: Beverly-windows.zip
