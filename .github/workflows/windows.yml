# Windows build of the editor: a zip with Beverly.exe and beverly-player.exe (the game player that File > Export
# Windows game copies into each exported game) - unzip and double-click, nothing to install.
# Builds on every push that touches editor/ (so Windows-only errors show up early; the zip is kept under the run's
# "Artifacts"). Only a run by hand from the Actions tab, or a push whose commit message contains [release], publishes
# a GitHub Release - releases are for finished features, not work in progress. Each release is named
# ("Beverly build N", tag build-N, the newest marked Latest) with the zip attached, and also kept under the
# run's "Artifacts". tools/make-zip.ps1 makes the same zip on your own PC.
# Each release also carries update.json (the build number and the zip's SHA-256): Help > Check for updates reads
# it from the release marked Latest, and the build number is built into the programs (BEVERLY_BUILD).
name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]   # the tessera branch is built and tested in its sessions, not here, so build numbers stay main's
    paths: ['editor/**', 'crates/**', '.github/workflows/windows.yml']
permissions:
  contents: write   # to publish the release
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor
      - name: Build
        working-directory: editor
        env:
          BEVERLY_BUILD: ${{ github.run_number }}
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Beverly | Out-Null
          Copy-Item editor/target/release/beverly.exe dist/Beverly/Beverly.exe
          Copy-Item editor/target/release/beverly-player.exe dist/Beverly/beverly-player.exe
          Copy-Item editor/README-windows.txt dist/Beverly/README.txt
          Compress-Archive -Path dist/Beverly -DestinationPath Beverly-windows.zip
          # the benchmark is its own small download (beverly-bench: sent to people to measure their card)
          New-Item -ItemType Directory -Force bench/Beverly-bench | Out-Null
          Copy-Item editor/target/release/beverly-bench.exe bench/Beverly-bench/beverly-bench.exe
          Copy-Item editor/README-bench.txt bench/Beverly-bench/README.txt
          Compress-Archive -Path bench/Beverly-bench -DestinationPath Beverly-bench-windows.zip
          $sha = (Get-FileHash Beverly-windows.zip -Algorithm SHA256).Hash.ToLower()
          @{ build = ${{ github.run_number }}; commit = "${{ github.sha }}"; files = @{ "Beverly-windows.zip" = $sha } } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM update.json
          Get-Content update.json
      - uses: actions/upload-artifact@v4
        with:
          name: Beverly-windows
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: Beverly-bench-windows
          path: Beverly-bench-windows.zip
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        with:
          tag_name: build-${{ github.run_number }}
          name: Beverly build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: "Unzip and run Beverly.exe (keep beverly-player.exe next to it: it is what exported games run on). Controls: README.txt."
          files: |
            Beverly-windows.zip
            Beverly-bench-windows.zip
            update.json
