[package]
name = "beverly"
version = "0.1.0"
edition = "2024"
build = "build.rs"
rust-version = "1.97.1"  # bevy 0.20.1 needs it
description = "Beverly: a simple, no-code-first 3D game editor for Bevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thriple/Beverly"
publish = false

[dependencies]
# pinned: Bevy's API breaks between releases; upgrade on purpose (bevy, bevy_egui and the toolchain together)
bevy = { version = "=0.20.1", default-features = false, features = [
    "default_app", "3d_bevy_render", "scene", "std", "bevy_winit", "webgl2", "free_camera",
    "png", "jpeg",  # textures (and the ones inside models)
    "sysinfo_plugin",  # the meter's memory (perf.rs)
] }
# the graphics card check before the app starts (gpu.rs); the version Bevy uses
wgpu = { version = "=30.0.1", default-features = false }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "manage_clipboard"] }
# physics: the one collision world while playing (physics.rs); pinned with bevy
avian3d = { version = "=0.8.0", default-features = false, features = ["3d", "parry-f32", "parallel"] }
# the walker: a floating character controller on Avian (play.rs)
bevy-tnua = "=0.33.2"
bevy-tnua-avian3d = { version = "=0.13.1", default-features = false }
# navigation areas: Recast's walkable area across floors (nav.rs)
bevy_rerecast = { version = "=0.6.1", default-features = false }
# paths on the area (nav.rs); bevy_landmass's agents come with Brains
landmass = "=0.9.3"
bevy_landmass = { version = "=0.13.0", default-features = false }
landmass_rerecast = "=0.4.0"
# the editor's frame, logo and panels drawn from the user's SVG (editor/frame.rs)
usvg = { version = "=0.50.0", default-features = false }
lyon_tessellation = "=1.0.23"
# letters' outlines for the editor's vector text (the version egui uses)
skrifa = "=0.44.0"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
# the window icon (editor.rs)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
winit = { version = "0.30", default-features = false }
# sound: kira's mixer, spatial tracks and decoders (sound.rs); mint is how it takes positions
kira = { version = "=0.12.6", default-features = false, features = ["cpal", "mp3", "ogg", "vorbis", "flac", "wav", "pcm"] }
mint = "0.5"
# Help > Check for updates (update.rs)
serde_json = "1"
sha2 = "0.10"
# virtual geometry (crates/tessera, docs/tessera.md); only with the `tessera` feature
tessera = { path = "../crates/tessera", optional = true }

[features]
# Tessera, virtual geometry: Bevy's meshlet renderer (forked in crates/bevy_pbr) and Beverly's side. Off by default.
tessera = ["bevy/meshlet", "bevy/meshlet_processor", "dep:tessera"]

# Tessera's render check: draws the test mesh with virtual geometry and saves a screenshot
[[bin]]
name = "vg-render"
required-features = ["tessera"]

# Tessera's instance benchmark: the meshlet systems' CPU time per frame with 10k / 100k copies
[[bin]]
name = "vg-bench"
required-features = ["tessera"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["multi_threaded", "x11", "wayland"] }
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
# Help > MCP Server (editor/mcp)
tiny_http = { version = "0.12", default-features = false }

# the program icon (build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell"] }

[profile.dev]
opt-level = 1
strip = "debuginfo"   # debug binaries are ~1.7 GB otherwise

[profile.dev.package."*"]
opt-level = 3

# the fork of Bevy's meshlet renderer (docs/tessera.md); its first commit is the untouched 0.20.1 copy
[patch.crates-io]
bevy_pbr = { path = "../crates/bevy_pbr" }
