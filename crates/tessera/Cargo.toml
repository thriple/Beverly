[package]
name = "tessera"
version = "0.1.0"
edition = "2024"
description = "Beverly's virtual geometry: the parts beside Bevy's meshlet renderer (crates/bevy_pbr)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# pinned with Beverly's bevy (editor/Cargo.toml)
bevy_asset = { version = "=0.20.1", default-features = false }
bevy_mesh = { version = "=0.20.1", default-features = false }
# the fork of Bevy's meshlet renderer (crates/bevy_pbr): MeshletMesh and its builder
bevy_pbr = { version = "=0.20.1", default-features = false, features = ["meshlet_processor"] }
# a bake outside an app needs Bevy's task pools
bevy_tasks = { version = "=0.20.1" }

# the same patch as editor/Cargo.toml, so this crate builds and tests on its own too
[patch.crates-io]
bevy_pbr = { path = "../bevy_pbr" }
